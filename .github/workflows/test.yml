name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Fyne build deps (needed for go vet + test on the GUI package)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Verify go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt check
        run: |
          # research/ holds vendored upstream clones (libtorrent,
          # transmission, anacrolix/torrent, etc.) — not our code.
          # Only check our own directories.
          gofmt_out=$(gofmt -l -s cmd/ internal/ contracts/)
          if [ -n "$gofmt_out" ]; then
            echo "::error::gofmt would reformat the following files:"
            echo "$gofmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: |
          # Exclude internal/wirecompat/scenarios — timing-sensitive
          # multi-client transfers between real anacrolix clients on
          # loopback, unreliable on shared CI runners. The grep is NOT
          # end-anchored so future subpackages stay excluded too. Run
          # locally with:
          #   go test -race ./internal/wirecompat/...
          pkgs=$(go list ./... | grep -Ev '/internal/wirecompat/scenarios(/|$)')
          go test -race -count=1 $pkgs
        timeout-minutes: 15
